[build]
  command = "npm install"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "@napi-rs/canvas", "pdfjs-dist", "pdf-to-png-converter"]
  # pdfjs loads its worker by filesystem path; esbuild externals omit these files otherwise
  included_files = [
    "node_modules/pdfjs-dist/**",
    "node_modules/pdf-to-png-converter/**",
    "node_modules/@napi-rs/**"
  ]

[functions."pdf-crop"]
  # PDF rendering + sharp can be slow on big files; give it headroom
  timeout = 26
